services:
  postgres:
    image: postgres:16-alpine
    container_name: bingo-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bingo_web
      POSTGRES_USER: bingo_app
      POSTGRES_PASSWORD: bingo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - bingo_web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo_app -d bingo_web"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bingo_web_postgres_data:
